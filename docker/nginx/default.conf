server {
    listen 80;
    server_name 192.168.2.105;

    # -------------------------
    # React SPA ルーティング
    # -------------------------
    location / {
    # React のビルドファイルを配信
    root /etc/nginx/html;
    try_files $uri /index.html;
    }

    # -------------------------
    # Laravel API (FastCGI)
    # -------------------------
    location ~ ^/(api|sanctum)(/.*)?$ {
        # CORS ヘッダーを常に追加
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRF-TOKEN, X-XSRF-TOKEN" always;

        # OPTIONS リクエストは 204 で返す（プリフライトリクエスト）
        if ($request_method = OPTIONS) {
            return 204;
        }

        root /var/www/html/public;   # Laravel public ディレクトリ
        index index.php;
        try_files $uri /index.php?$query_string;

        # PHP-FPM にリクエストを渡す
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # SCRIPT_FILENAME と PATH_INFO を正しく設定
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # -------------------------
    # 静的ファイルキャッシュ
    # -------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}
